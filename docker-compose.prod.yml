# Production stack: gunicorn against Supabase Postgres.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: ./backend/.env.prod
    # Migrations run once at start-up, then gunicorn takes over as PID 1.
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application
                  --bind 0.0.0.0:8000
                  --workers 3
                  --threads 2
                  --timeout 60
                  --access-logfile -
                  --error-logfile -"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
