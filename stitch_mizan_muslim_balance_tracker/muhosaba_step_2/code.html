<!DOCTYPE html>

<html lang="uz"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mizan - Guided Reflection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f3f4f3",
                    "on-background": "#191c1c",
                    "on-primary": "#ffffff",
                    "on-secondary-container": "#00714d",
                    "surface-dim": "#d9dad9",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#374b42",
                    "on-secondary-fixed": "#002113",
                    "primary": "#006a43",
                    "on-primary-container": "#f6fff6",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#7efaba",
                    "surface-tint": "#006c45",
                    "inverse-surface": "#2e3131",
                    "background": "#f9f9f8",
                    "surface-container-high": "#e7e8e7",
                    "tertiary": "#4b6157",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f9f9f8",
                    "secondary-fixed-dim": "#45dfa2",
                    "surface-container-highest": "#e1e3e2",
                    "tertiary-fixed": "#d0e8dc",
                    "on-surface": "#191c1c",
                    "on-tertiary-container": "#f5fff8",
                    "outline": "#6d7a71",
                    "inverse-on-surface": "#f0f1f0",
                    "outline-variant": "#bccabf",
                    "secondary-container": "#64f9ba",
                    "secondary-fixed": "#68fcbc",
                    "secondary": "#006c49",
                    "surface-variant": "#e1e3e2",
                    "surface-container": "#edeeed",
                    "primary-container": "#008656",
                    "on-secondary-fixed-variant": "#005236",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#60dd9f",
                    "on-tertiary-fixed": "#0b1f18",
                    "on-primary-fixed": "#002112",
                    "tertiary-fixed-dim": "#b5ccc0",
                    "tertiary-container": "#64796f",
                    "on-surface-variant": "#3d4a41",
                    "inverse-primary": "#60dd9f",
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "surface": "#f9f9f8",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#005233"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "card-padding": "24px",
                    "stack-gap-lg": "32px",
                    "stack-gap-sm": "8px",
                    "stack-gap-md": "16px",
                    "gutter": "12px",
                    "container-margin": "20px"
            },
            "fontFamily": {
                    "label-caps": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "display-numeral": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-sm": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "display-numeral": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .emerald-gradient {
            background: linear-gradient(135deg, #0FA36B 0%, #4EE6A8 100%);
        }
        .emerald-shadow {
            box-shadow: 0 10px 30px rgba(15, 163, 107, 0.08);
        }
        .active-ring {
            box-shadow: 0 0 0 4px rgba(15, 163, 107, 0.1);
        }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #0FA36B;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F7F8F7] text-on-background font-body-lg overflow-hidden h-screen flex flex-col">
<!-- Top Navigation Area -->
<header class="w-full flex justify-between items-center px-container-margin py-stack-gap-md max-w-2xl mx-auto">
<button aria-label="Close reflection" class="p-2 -ml-2 transition-transform active:scale-95">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<!-- Progress Dots -->
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2.5 h-2.5 rounded-full emerald-gradient ring-2 ring-primary-fixed-dim/30"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Category Chip -->
<div class="bg-white px-3 py-1.5 rounded-full flex items-center gap-2 emerald-shadow">
<span class="w-2 h-2 rounded-full bg-[#0FA36B]"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Jismoniy</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin py-stack-gap-lg max-w-2xl mx-auto w-full">
<div class="space-y-stack-gap-lg">
<!-- Question Section -->
<div class="space-y-stack-gap-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                    Bu hafta tanangiz haqiga qanchalik e'tibor berdingiz?
                </h1>
<!-- Data Insight Card -->
<div class="bg-white p-4 rounded-xl emerald-shadow flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">analytics</span>
<div>
<p class="font-body-sm text-on-surface-variant leading-relaxed">
                            Sport: <span class="font-semibold text-on-surface">2/3 mashg'ulot</span> · O'rtacha uyqu: <span class="font-semibold text-on-surface">6.4 soat</span>
</p>
</div>
</div>
</div>
<!-- Answer Selection: 1-5 Row -->
<div class="space-y-stack-gap-md py-4">
<div class="flex justify-between items-center relative">
<!-- Numbers -->
<button class="score-btn w-12 h-12 rounded-full border border-outline-variant bg-white flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant transition-all duration-300 active:scale-95" id="score-1" onclick="selectScore(1)">1</button>
<button class="score-btn w-12 h-12 rounded-full border border-outline-variant bg-white flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant transition-all duration-300 active:scale-95" id="score-2" onclick="selectScore(2)">2</button>
<button class="score-btn w-12 h-12 rounded-full border border-outline-variant bg-white flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant transition-all duration-300 active:scale-95" id="score-3" onclick="selectScore(3)">3</button>
<button class="score-btn w-14 h-14 rounded-full emerald-gradient emerald-shadow active-ring flex items-center justify-center font-headline-md text-headline-md text-white transition-all duration-300 scale-110 active:scale-100" id="score-4" onclick="selectScore(4)">4</button>
<button class="score-btn w-12 h-12 rounded-full border border-outline-variant bg-white flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant transition-all duration-300 active:scale-95" id="score-5" onclick="selectScore(5)">5</button>
</div>
<div class="flex justify-between px-1">
<span class="font-label-caps text-label-caps text-outline">Yomon</span>
<span class="font-label-caps text-label-caps text-outline">A'lo</span>
</div>
</div>
<!-- Text Field Area -->
<div class="space-y-stack-gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="reflection-text">Fikrlar (ixtiyoriy)</label>
<textarea class="w-full bg-white border-none rounded-xl p-card-padding emerald-shadow font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0 min-h-[160px] resize-none" id="reflection-text" placeholder="Izoh yozing..."></textarea>
</div>
</div>
</main>
<!-- Bottom Action -->
<footer class="p-container-margin max-w-2xl mx-auto w-full bg-gradient-to-t from-[#F7F8F7] via-[#F7F8F7] to-transparent">
<button class="w-full emerald-gradient h-[56px] rounded-full flex items-center justify-center font-headline-md text-on-primary shadow-lg active:scale-[0.98] transition-transform duration-150">
            Keyingisi
        </button>
<!-- Home Indicator Spacing -->
<div class="h-safe-area-inset-bottom"></div>
</footer>
<script>
        function selectScore(num) {
            const buttons = document.querySelectorAll('.score-btn');
            buttons.forEach(btn => {
                // Reset styling
                btn.classList.remove('emerald-gradient', 'emerald-shadow', 'active-ring', 'text-white', 'scale-110', 'w-14', 'h-14', 'border-none');
                btn.classList.add('w-12', 'h-12', 'border', 'border-outline-variant', 'bg-white', 'text-on-surface-variant');
            });

            // Apply styling to selected
            const activeBtn = document.getElementById(`score-${num}`);
            activeBtn.classList.remove('w-12', 'h-12', 'border', 'border-outline-variant', 'bg-white', 'text-on-surface-variant');
            activeBtn.classList.add('emerald-gradient', 'emerald-shadow', 'active-ring', 'text-white', 'scale-110', 'w-14', 'h-14', 'border-none');
        }

        // Focus behavior for accessibility
        const textarea = document.getElementById('reflection-text');
        textarea.addEventListener('focus', () => {
            textarea.closest('main').scrollTo({
                top: textarea.offsetTop - 100,
                behavior: 'smooth'
            });
        });
    </script>
</body></html>
