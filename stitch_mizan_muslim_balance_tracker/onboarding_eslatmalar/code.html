<style>
        body {
            background-color: #f9f9f8;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .bg-primary-gradient {
            background: linear-gradient(135deg, #0FA36B 0%, #4EE6A8 100%);
        }
        .bell-ring {
            animation: ring 4s infinite cubic-bezier(0.36, 0.11, 0.89, 0.32);
        }
        @keyframes ring {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 0.3; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .delay-1 { animation-delay: 1s; }
        .delay-2 { animation-delay: 2s; }
        
        .toggle-checkbox:checked + .toggle-slot {
            background-color: #006a43;
        }
        .toggle-checkbox:checked + .toggle-slot .toggle-dot {
            transform: translateX(1.5rem);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="font-body-lg text-on-surface selection:bg-secondary-container">
<!-- Onboarding Canvas -->
<main class="min-h-screen flex flex-col px-container-margin pt-stack-gap-lg pb-safe-area-inset-bottom">
<!-- Illustration Section -->
<div class="flex-grow flex flex-col items-center justify-center relative py-stack-gap-lg overflow-hidden">
<!-- Animated Background Rings -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="bell-ring w-48 h-48 rounded-full border-2 border-primary/20"></div>
<div class="bell-ring delay-1 w-64 h-64 rounded-full border-2 border-primary/10"></div>
<div class="bell-ring delay-2 w-80 h-80 rounded-full border-2 border-primary/5"></div>
</div>
<!-- Central Icon Asset -->
<div class="relative z-10 w-40 h-40 bg-surface-container-lowest rounded-full shadow-[0_10px_30px_rgba(15,163,107,0.08)] flex items-center justify-center mb-stack-gap-lg">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'wght' 200;">notifications_active</span>
</div>
<!-- Copy -->
<div class="text-center z-10 max-w-xs mx-auto">

<p class="font-body-sm text-on-surface-variant opacity-80">Azon vaqtida va har yakshanba muhosaba uchun</p>
</div>
</div>
<!-- Toggles Section (Bento-lite) -->
<section class="space-y-stack-gap-sm mb-stack-gap-lg">
<!-- Toggle Item 1 -->
<label class="flex items-center justify-between p-card-padding bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(15,163,107,0.04)] border border-outline-variant/20 cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
</div>
<span class="font-body-lg font-semibold text-on-surface">Azon eslatmasi</span>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer hidden" id="toggle1" name="toggle" type="checkbox"/>
<div class="toggle-slot block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer transition-colors duration-300">
<div class="toggle-dot w-6 h-6 bg-white rounded-full border-2 border-transparent transition-transform duration-300"></div>
</div>
</div>
</label>

<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">

</div>
<span class="font-body-lg font-semibold text-on-surface">Ertalabki reja</span>
</div>

<div class="w-2 h-2 rounded-full bg-primary/20"></div>

</div>

</main>
<script>
        // Simple toggle logic for the custom UI
        document.querySelectorAll('.toggle-slot').forEach(slot => {
            slot.addEventListener('click', (e) => {
                const checkbox = slot.previousElementSibling;
                checkbox.checked = !checkbox.checked;
            });
        });

        // Add subtle hover effect for cards
        document.querySelectorAll('label').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.boxShadow = '0 10px 20px rgba(15, 163, 107, 0.08)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.boxShadow = '0 4px 12px rgba(15, 163, 107, 0.04)';
            });
        });
    </script>
