<!-- Visual Polish: Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('opacity-90');
                });
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('opacity-90');
                });
            });

            // Simulate a "ripple" or subtle pulse on the location icon
            const locationIcon = document.querySelector('.material-symbols-outlined.text-\\[20px\\]');
            if(locationIcon) {
                setInterval(() => {
                    locationIcon.classList.add('scale-110', 'text-primary');
                    setTimeout(() => {
                        locationIcon.classList.remove('scale-110', 'text-primary');
                    }, 1000);
                }, 3000);
            }
        });
    </script>
