[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "DJ", "SIM", "RUF"]
# RUF012: Django Meta/admin class attributes are lists by convention, not
# mutable defaults shared across instances.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Category.dimension is an optional enum: NULL means "no dimension", which the
# empty string cannot express for a choice field.
"apps/finance/models.py" = ["DJ001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["dj_database_url.*", "decouple.*", "dj_rest_auth.*", "adhanpy.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra"
